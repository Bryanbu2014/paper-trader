name: Ping Streamlit

on:
  push:
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Visit and Screenshot Streamlit
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            
            // Disguise the robot as a normal Windows/Chrome user
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();
            
            console.log('Loading page...');
            await page.goto('https://paper-trading-pg.streamlit.app/'); // Put your URL here!
            
            console.log('Waiting 45 seconds for the app to wake up and render...');
            await page.waitForTimeout(45000); 

            console.log('Taking a screenshot...');
            // Take a picture and save it to the temporary computer
            await page.screenshot({ path: 'debug-screenshot.png', fullPage: true });
            console.log('Screenshot saved!');

            console.log('--- WHAT THE ROBOT SEES RIGHT NOW ---');
            // This reads every single word on the screen and prints it!
            const visibleText = await page.innerText('body');
            console.log(visibleText);
            console.log('-------------------------------------');
            
            await browser.close();

          })();
          "

      # This new step grabs the picture from the robot and gives it to you!
      - name: Upload Screenshot to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: robot-eyes-screenshot
          path: debug-screenshot.png