name: Ping Streamlit

on:
  push:
  schedule:
    - cron: '0 */10 * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Visit and Login to Streamlit App
        env:
          USER: ${{ secrets.APP_USER_PING }}
          PASS: ${{ secrets.APP_PASS_PING }}
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            
            console.log('Loading page...')
            await page.goto('https://paper-trading-pg.streamlit.app/');
            await page.waitForTimeout(5000);

            console.log('--- WHAT THE ROBOT SEES RIGHT NOW ---');
            // This reads every single word on the screen and prints it!
            const visibleText = await page.innerText('body');
            console.log(visibleText);
            console.log('-------------------------------------');
          "